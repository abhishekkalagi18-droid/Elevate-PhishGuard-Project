{% extends "base.html" %}

{% block content %}
<div class="landing-wrapper" style="justify-content: center; align-items: center; text-align: center; padding: 2rem;">
    <div class="card" style="max-width: 480px; width: 100%; padding: 3rem 2rem;">
        <span class="badge badge-warning" style="margin-bottom: 1rem;">Status 404</span>
        <h1 style="font-size: 2rem; margin-bottom: 0.75rem;">Page Not Found</h1>
        <p style="color: var(--text-secondary); margin-bottom: 1.5rem;">
            The simulation page or dashboard resource you requested could not be located or has expired.
        </p>
        <div style="display: flex; gap: 0.75rem; justify-content: center;">
            <a href="/" class="btn btn-secondary">Landing Page</a>
            <a href="{{ url_for('dashboard.overview') }}" class="btn btn-primary">Dashboard</a>
        </div>
    </div>
</div>
{% endblock %}
